<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binomial Distribution</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #1f3c88;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #1f3c88;
    }

    .error {
      color: #d93025;
      font-size: 14px;
      margin-top: 6px;
      display: none;
    }

    .selected-values {
      margin-top: 25px;
      padding: 20px;
      background: #eef4ff;
      border-left: 5px solid #1f3c88;
      border-radius: 6px;
    }

    .selected-values h3 {
      margin-top: 0;
      color: #1f3c88;
    }

    .value {
      font-size: 18px;
      margin: 8px 0;
    }

    .valid {
      border-color: #28a745;
    }

    .invalid {
      border-color: #d93025;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Binomial Distribution</h1>
    <p class="subtitle">
      Enter the number of trials and probability of success.
    </p>

    <!-- Number of trials -->
    <div class="input-group">
      <label for="trials">Number of trials (n)</label>

      <input
        type="number"
        id="trials"
        value="20"
        min="1"
        step="1"
      >

      <div id="nError" class="error">
        n must be a positive integer.
      </div>
    </div>

    <!-- Probability -->
    <div class="input-group">
      <label for="probability">Probability of success (p)</label>

      <input
        type="number"
        id="probability"
        value="0.35"
        min="0"
        max="1"
        step="0.01"
      >

      <div id="pError" class="error">
        p must be between 0 and 1.
      </div>
    </div>

    <!-- Selected values -->
    <div class="selected-values">
      <h3>Selected Values</h3>

      <div class="value">
        <strong>Number of trials (n):</strong>
        <span id="displayN">20</span>
      </div>

      <div class="value">
        <strong>Probability of success (p):</strong>
        <span id="displayP">0.35</span>
      </div>
    </div>

  </div>

  <script>
    const trialsInput = document.getElementById("trials");
    const probabilityInput = document.getElementById("probability");

    const displayN = document.getElementById("displayN");
    const displayP = document.getElementById("displayP");

    const nError = document.getElementById("nError");
    const pError = document.getElementById("pError");

    function validateInputs() {
      const n = Number(trialsInput.value);
      const p = Number(probabilityInput.value);

      let nValid = Number.isInteger(n) && n > 0;
      let pValid = !isNaN(p) && p >= 0 && p <= 1;

      // Validate n
      if (nValid) {
        trialsInput.classList.add("valid");
        trialsInput.classList.remove("invalid");
        nError.style.display = "none";
        displayN.textContent = n;
      } else {
        trialsInput.classList.add("invalid");
        trialsInput.classList.remove("valid");
        nError.style.display = "block";
      }

      // Validate p
      if (pValid) {
        probabilityInput.classList.add("valid");
        probabilityInput.classList.remove("invalid");
        pError.style.display = "none";
        displayP.textContent = p;
      } else {
        probabilityInput.classList.add("invalid");
        probabilityInput.classList.remove("valid");
        pError.style.display = "block";
      }
    }

    trialsInput.addEventListener("input", validateInputs);
    probabilityInput.addEventListener("input", validateInputs);

    // Validate default values
    validateInputs();
  </script>

</body>
</html>
